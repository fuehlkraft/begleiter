<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Fühlkraft – Inneres-Kind-Begleiter</title>
<meta name="description" content="Dein achtsamer Begleiter für Reflexion, Wachstum und Sichtbarkeit.">
<meta name="theme-color" content="#7E9670">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fühlkraft">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#F6F1E7; --bg-soft:#EFE7D6; --sand:#E7D6AF; --surface:#FFFDF9; --surface-2:#F2EADA;
    --forest:#33472F; --forest-deep:#22301F; --sage:#7E9670; --sage-light:#B9C9A9; --sage-dark:#5C7350;
    --ochre:#C79A56; --text:#2B2E22; --text-soft:#5F6653; --text-faint:#93987F;
    --border:#E1D3AE; --shadow:0 10px 30px rgba(63,71,49,0.09); --shadow-sm:0 3px 10px rgba(63,71,49,.08);
    --radius-lg:26px; --radius-md:18px; --radius-sm:12px;
    --danger:#B15C4A; --danger-bg:#F6E4DC;
    --font-display:'Fraunces',serif; --font-body:'Work Sans',sans-serif;
  }
  [data-theme="dark"]{
    --bg:#171D15; --bg-soft:#1D2419; --sand:#2C3423; --surface:#212A1D; --surface-2:#28321F;
    --forest:#D3E3C4; --forest-deep:#EFEADA; --sage:#93AC80; --sage-light:#6F8A5F; --sage-dark:#B9C9A9;
    --ochre:#DDBB7C; --text:#EAE4D3; --text-soft:#BFC4AE; --text-faint:#828A6E;
    --border:#37402C; --shadow:0 10px 30px rgba(0,0,0,.4); --shadow-sm:0 3px 12px rgba(0,0,0,.35);
    --danger:#D98268; --danger-bg:#3A2620;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body);
    -webkit-font-smoothing:antialiased; transition:background .4s ease,color .4s ease;
  }
  h1,h2,h3,.display{ font-family:var(--font-display); font-weight:600; color:var(--forest); letter-spacing:.2px; }
  button{ font-family:var(--font-body); cursor:pointer; }
  textarea,input{ font-family:var(--font-body); }
  ::selection{ background:var(--sage-light); }
  a{ color:var(--sage-dark); }

  #app{ display:flex; min-height:100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:238px; flex-shrink:0; background:var(--bg-soft); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:24px 16px; gap:6px; position:sticky; top:0; height:100vh;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:6px 10px 22px; }
  .brand-mark{ width:34px; height:34px; flex-shrink:0; }
  .brand-name{ font-family:var(--font-display); font-size:20px; font-weight:600; color:var(--forest); }
  .brand-sub{ font-size:11px; color:var(--text-faint); margin-top:-2px; }
  .nav-item{
    display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:var(--radius-sm);
    color:var(--text-soft); background:transparent; border:none; text-align:left; font-size:14.5px; font-weight:500;
    transition:background .2s,color .2s;
  }
  .nav-item svg{ width:19px; height:19px; flex-shrink:0; opacity:.85; }
  .nav-item:hover{ background:var(--surface-2); color:var(--text); }
  .nav-item.active{ background:var(--surface); color:var(--forest); box-shadow:var(--shadow-sm); }
  .sidebar-foot{ margin-top:auto; display:flex; flex-direction:column; gap:6px; }

  /* ---------- Main ---------- */
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    display:none; align-items:center; justify-content:space-between; padding:14px 18px;
    background:var(--bg-soft); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:5;
  }
  .view{ flex:1; padding:34px 42px 90px; max-width:980px; width:100%; margin:0 auto; }
  .view.narrow{ max-width:760px; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); padding:26px 28px; }
  .btn{ border-radius:999px; padding:11px 22px; font-size:14.5px; font-weight:600; border:1px solid transparent; transition:transform .15s, box-shadow .15s, background .2s; }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--sage); color:#fff; box-shadow:var(--shadow-sm); }
  .btn-primary:hover{ background:var(--sage-dark); }
  .btn-ghost{ background:transparent; color:var(--forest); border-color:var(--border); }
  .btn-ghost:hover{ background:var(--surface-2); }
  .btn-danger{ background:var(--danger-bg); color:var(--danger); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .pill{ display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:4px 11px; border-radius:999px; background:var(--surface-2); color:var(--text-soft); }

  /* ---------- Growth ring (signature element) ---------- */
  .ring-wrap{ position:relative; display:flex; align-items:center; justify-content:center; }
  .ring-wrap svg circle{ fill:none; }
  .breathe{ animation:breathe 4.2s ease-in-out infinite; transform-origin:center; }
  @keyframes breathe{ 0%,100%{ transform:scale(1); opacity:.75 } 50%{ transform:scale(1.06); opacity:1 } }
  .butterfly-flap{ animation: flap .45s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes flap{ from{ transform: scaleX(1); } to{ transform: scaleX(0.35); } }
  .fly-a{ animation: flyA 9s ease-in-out infinite; }
  .fly-b{ animation: flyB 11s ease-in-out infinite; }
  .fly-c{ animation: flyC 7.5s ease-in-out infinite; }
  @keyframes flyA{ 0%{transform:translate(0,0) rotate(0deg);} 25%{transform:translate(16px,-14px) rotate(8deg);} 50%{transform:translate(2px,-26px) rotate(-4deg);} 75%{transform:translate(-15px,-9px) rotate(6deg);} 100%{transform:translate(0,0) rotate(0deg);} }
  @keyframes flyB{ 0%{transform:translate(0,0) rotate(0deg);} 30%{transform:translate(-19px,-8px) rotate(-8deg);} 60%{transform:translate(-7px,-21px) rotate(5deg);} 100%{transform:translate(0,0) rotate(0deg);} }
  @keyframes flyC{ 0%{transform:translate(0,0) rotate(0deg);} 40%{transform:translate(13px,-17px) rotate(6deg);} 70%{transform:translate(21px,-3px) rotate(-6deg);} 100%{transform:translate(0,0) rotate(0deg);} }
  .caterpillar-crawl{ animation: crawl 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
  @keyframes crawl{ 0%,100%{ transform: scaleX(1) translateX(0); } 50%{ transform: scaleX(0.82) translateX(2px); } }
  @media (prefers-reduced-motion: reduce){
    .breathe,.fly-a,.fly-b,.fly-c,.butterfly-flap,.caterpillar-crawl{ animation: none !important; }
  }

  /* ---------- Home ---------- */
  .greeting{ font-size:30px; margin:0 0 6px; }
  .greeting-sub{ color:var(--text-soft); margin:0 0 30px; font-size:15px; }
  .home-grid{ display:grid; grid-template-columns:1.3fr 1fr; gap:20px; }
  .quick-actions{ display:flex; flex-direction:column; gap:12px; margin-top:18px; }
  .quick-btn{ display:flex; align-items:center; gap:12px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px 16px; text-align:left; font-size:14px; color:var(--text); }
  .quick-btn:hover{ background:var(--sand); }
  .quick-btn .qtitle{ font-weight:600; display:block; }
  .quick-btn .qsub{ color:var(--text-faint); font-size:12.5px; }
  @media (max-width:860px){ .home-grid{ grid-template-columns:1fr; } }

  /* ---------- Chat ---------- */
  .chat-shell{ display:flex; flex-direction:column; height:calc(100vh - 40px); }
  .chat-head{ display:flex; align-items:center; justify-content:space-between; padding:20px 4px 14px; border-bottom:1px solid var(--border); }
  .chat-scroll{ flex:1; overflow-y:auto; padding:22px 4px; display:flex; flex-direction:column; gap:16px; }
  .msg{ max-width:74%; padding:14px 17px; border-radius:20px; font-size:14.8px; line-height:1.62; white-space:pre-wrap; }
  .msg.assistant{ align-self:flex-start; background:var(--surface); border:1px solid var(--border); border-bottom-left-radius:6px; box-shadow:var(--shadow-sm); }
  .msg.user{ align-self:flex-end; background:var(--sage); color:#fff; border-bottom-right-radius:6px; }
  .msg.system-note{ align-self:center; background:var(--surface-2); color:var(--text-faint); font-size:12.5px; border-radius:999px; padding:6px 14px; }
  .typing{ align-self:flex-start; display:flex; gap:5px; padding:14px 17px; }
  .typing span{ width:6px; height:6px; border-radius:50%; background:var(--sage); animation:blink 1.2s infinite; }
  .typing span:nth-child(2){ animation-delay:.2s } .typing span:nth-child(3){ animation-delay:.4s }
  @keyframes blink{ 0%,80%,100%{ opacity:.25 } 40%{ opacity:1 } }
  .chat-input-bar{ display:flex; gap:10px; align-items:flex-end; padding:14px 4px 4px; border-top:1px solid var(--border); }
  .chat-input-bar textarea{ flex:1; resize:none; border:1px solid var(--border); border-radius:var(--radius-md); padding:13px 16px; font-size:14.5px; background:var(--surface); color:var(--text); max-height:160px; min-height:48px; }
  .chat-input-bar textarea:focus{ outline:2px solid var(--sage-light); }
  .send-btn{ width:46px; height:46px; border-radius:50%; background:var(--sage); border:none; color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .mic-btn{ width:38px; height:38px; border-radius:50%; background:var(--surface-2); border:1px solid var(--border); color:var(--forest); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .mic-btn:hover{ background:var(--sand); }
  .mic-btn.recording{ background:var(--danger); color:#fff; border-color:var(--danger); animation:micPulse 1.2s infinite; }
  .mic-btn svg{ width:17px; height:17px; }
  @keyframes micPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(177,92,74,.45);} 50%{ box-shadow:0 0 0 8px rgba(177,92,74,0);} }
  .field-with-mic{ display:flex; gap:8px; align-items:flex-end; }
  .field-with-mic textarea, .field-with-mic input{ flex:1; }
  .send-btn:hover{ background:var(--sage-dark); }
  .chat-foot-actions{ display:flex; justify-content:center; padding-top:10px; }

  /* ---------- Crisis panel ---------- */
  .crisis-panel{ background:linear-gradient(160deg,var(--surface),var(--surface-2)); border:1px solid var(--border); border-radius:var(--radius-lg); padding:26px 28px; box-shadow:var(--shadow); }
  .crisis-panel h3{ margin-top:0; }
  .resource-row{ display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px dashed var(--border); font-size:14px; }
  .resource-row:last-child{ border-bottom:none; }

  /* ---------- Feelings wheel ---------- */
  .wheel-layout{ display:flex; gap:34px; flex-wrap:wrap; align-items:flex-start; }
  .wheel-svg-wrap{ flex:0 0 300px; }
  .wheel-detail{ flex:1; min-width:260px; }
  .chip{ display:inline-flex; padding:8px 14px; margin:4px 6px 0 0; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); font-size:13.5px; }
  .chip:hover{ background:var(--sand); }
  .chip.selected{ background:var(--sage); color:#fff; border-color:var(--sage); }

  /* ---------- Journal ---------- */
  .journal-toolbar{ display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  .journal-toolbar input{ flex:1; min-width:180px; padding:11px 15px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--text); }
  .entry{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:16px 18px; margin-bottom:12px; box-shadow:var(--shadow-sm); }
  .entry-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .entry-date{ font-size:12px; color:var(--text-faint); }
  .entry-tag{ font-size:11px; padding:2px 9px; border-radius:999px; background:var(--surface-2); color:var(--text-soft); }
  .star-btn{ background:none; border:none; font-size:17px; color:var(--text-faint); }
  .star-btn.fav{ color:var(--ochre); }

  /* ---------- Progress ---------- */
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:28px; }
  .stat-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:18px; text-align:center; }
  .stat-num{ font-family:var(--font-display); font-size:28px; color:var(--forest); }
  .stat-label{ font-size:12px; color:var(--text-soft); margin-top:2px; }
  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:13.5px; }
  .bar-label{ width:110px; flex-shrink:0; color:var(--text-soft); }
  .bar-track{ flex:1; background:var(--surface-2); border-radius:999px; height:10px; overflow:hidden; }
  .bar-fill{ background:var(--sage); height:100%; border-radius:999px; }

  /* ---------- Modules (exercises) ---------- */
  .mod-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px; }
  .mod-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:18px; cursor:pointer; transition:transform .15s; }
  .mod-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow); }
  .mod-card h4{ margin:8px 0 4px; font-family:var(--font-display); color:var(--forest); }
  .mod-card p{ font-size:12.8px; color:var(--text-soft); margin:0; }

  /* ---------- Modals ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(30,35,25,.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal{ background:var(--surface); border-radius:var(--radius-lg); padding:30px; max-width:560px; width:100%; max-height:86vh; overflow-y:auto; box-shadow:var(--shadow); }

  /* ---------- Settings ---------- */
  .switch-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--border); }
  .switch{ width:44px; height:25px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); position:relative; }
  .switch.on{ background:var(--sage); }
  .switch .knob{ width:19px; height:19px; border-radius:50%; background:#fff; position:absolute; top:2px; left:2px; transition:left .2s; box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .switch.on .knob{ left:21px; }

  textarea.big{ width:100%; min-height:180px; border-radius:var(--radius-md); border:1px solid var(--border); padding:14px 16px; font-size:14.5px; background:var(--surface); color:var(--text); }
  label.field-label{ font-size:12.5px; color:var(--text-soft); display:block; margin:14px 0 6px; }

  .disclaimer-box{ background:var(--surface-2); border-left:3px solid var(--sage); border-radius:10px; padding:12px 15px; font-size:12.5px; color:var(--text-soft); margin-top:18px; }

  /* mobile nav */
  .mobile-tabbar{ display:none; }
  @media (max-width:860px){
    .sidebar{ display:none; }
    .topbar{ display:flex; }
    .view{ padding:22px 16px 100px; }
    .home-grid{ grid-template-columns:1fr; }
    .msg{ max-width:88%; }
    .mobile-tabbar{
      display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--bg-soft); border-top:1px solid var(--border);
      justify-content:space-around; padding:8px 4px calc(8px + env(safe-area-inset-bottom)); z-index:20;
    }
    .mobile-tabbar button{ background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; color:var(--text-faint); padding:4px 8px; }
    .mobile-tabbar button.active{ color:var(--forest); }
    .mobile-tabbar svg{ width:20px; height:20px; }
    .chat-shell{ height:calc(100vh - 130px); }
  }

  @media print{
    .sidebar,.topbar,.mobile-tabbar,.chat-input-bar,.no-print{ display:none !important; }
    body{ background:#fff; color:#000; }
    .view{ max-width:100%; padding:0; }
  }

  .scrim-fade{ animation:fadeIn .35s ease; }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }
</style>


</head>

<div id="app"></div>

/* ============================= STORAGE HELPERS ============================= */
function hasNativeStorage(){
  return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';
}
const LS_INDEX_KEY = '__fuhlkraft_keys__';
function lsGetIndex(){ try{ return JSON.parse(localStorage.getItem(LS_INDEX_KEY)||'[]'); }catch(e){ return []; } }
function lsSetIndex(arr){ try{ localStorage.setItem(LS_INDEX_KEY, JSON.stringify(arr)); }catch(e){} }

async function sGet(key){
  try{
    if(hasNativeStorage()){
      const r = await window.storage.get(key,false); return r? JSON.parse(r.value):null;
    }
    const raw = localStorage.getItem('fk:'+key);
    return raw? JSON.parse(raw):null;
  }catch(e){ return null; }
}
async function sSet(key,val){
  try{
    if(hasNativeStorage()){
      await window.storage.set(key, JSON.stringify(val), false); return true;
    }
    localStorage.setItem('fk:'+key, JSON.stringify(val));
    const idx = lsGetIndex(); if(!idx.includes(key)){ idx.push(key); lsSetIndex(idx); }
    return true;
  }catch(e){ console.error('storage set failed',e); return false; }
}
async function sDelete(key){
  try{
    if(hasNativeStorage()){ await window.storage.delete(key,false); return; }
    localStorage.removeItem('fk:'+key);
    lsSetIndex(lsGetIndex().filter(k=>k!==key));
  }catch(e){}
}
async function sList(prefix){
  try{
    if(hasNativeStorage()){ const r = await window.storage.list(prefix,false); return r? r.keys:[]; }
    return lsGetIndex().filter(k=> k.startsWith(prefix));
  }catch(e){ return []; }
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function nowISO(){ return new Date().toISOString(); }
function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' · ' + d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

async function exportAllData(){

  const data = {};
  for(const p of prefixes){
    const keys = await sList(p);
    for(const k of keys){
      const val = await sGet(k);
      if(val!==null) data[k] = val;
    }
  }
  const profile = await sGet('profile');
  if(profile){
    const safeProfile = Object.assign({}, profile);
    delete safeProfile.apiKey;
    data['profile'] = safeProfile;
  }
  return {app:'fuehlkraft', version:1, exportedAt: nowISO(), data};
}
function downloadJson(obj, filename){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function importAllData(obj){
  if(!obj || typeof obj.data !== 'object') throw new Error('Ungültiges Backup-Format.');
  const entries = Object.entries(obj.data);
  for(const [key, val] of entries){
    if(key === 'profile'){
      const existing = await sGet('profile') || {};
      const merged = Object.assign({}, val, {apiKey: existing.apiKey || ''});
      await sSet('profile', merged);
    } else {
      await sSet(key, val);
    }
  }
  return entries.length;
}

function hasApiKey(){ return !!(State.apiKey && State.apiKey.trim()); }

function noGoInstructionText(){

  if(State.noGoWords && State.noGoWords.length){
    text += ' Verwende außerdem NIEMALS folgende Wörter oder Formulierungen, unter keinen Umständen: ' + State.noGoWords.join(', ') + '.';
  }
  return text;
}
function stripEmDashes(text){
  if(!text || typeof text !== 'string') return text;
  return text.replace(/\s*[—–]\s*/g, ', ').replace(/,\s*,/g, ',').replace(/,\s*\./g, '.').replace(/,\s*$/,'');
}
function sanitizeDeep(value){
  if(typeof value === 'string') return stripEmDashes(value);
  if(Array.isArray(value)) return value.map(sanitizeDeep);
  if(value && typeof value === 'object'){
    const out = {};
    Object.keys(value).forEach(k=>{ out[k] = sanitizeDeep(value[k]); });
    return out;
  }
  return value;
}

async function callClaude(systemPrompt, messages, maxTokens){
  const headers = { "Content-Type":"application/json" };
  if(hasApiKey()){
    headers["x-api-key"] = State.apiKey.trim();
    headers["anthropic-version"] = "2023-06-01";
    headers["anthropic-dangerous-direct-browser-access"] = "true";
  }
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers,
    body: JSON.stringify({
      model:"claude-sonnet-4-6",
      max_tokens: maxTokens || 1000,
      system: systemPrompt,
      messages: messages,
    })
  });
  if(!res.ok){
    let detail = '';
    try{ const errJson = await res.json(); detail = (errJson && errJson.error && errJson.error.message) || ''; }catch(e){}
    throw new Error('API-Fehler '+res.status+(detail?': '+detail:''));
  }
  const data = await res.json();
  const text = (data.content||[]).map(b=>b.type==='text'?b.text:'').join('\n');
  return text;
}

/* ============================= LONG-TERM CONTEXT (Tiefenkompass Langzeitgedächtnis) ============================= */
function sessionsWithContent(excludeId){
  return State.sessions.filter(s=> s.id!==excludeId && s.messages.some(m=>m.role==='user'));
}
function globalPatternSessionCounts(excludeId){
  const sessions = sessionsWithContent(excludeId);
  const counts = {};
  sessions.forEach(s=>{
    Object.keys((s.analysis&&s.analysis.patternTags)||{}).forEach(t=>{ counts[t]=(counts[t]||0)+1; });
  });
  return {counts, total: sessions.length};
}
function buildLongTermContextText(excludeId){
  const sessions = sessionsWithContent(excludeId);
  if(!sessions.length) return '';
  const {counts, total} = globalPatternSessionCounts(excludeId);
  const recurring = Object.entries(counts).filter(([,c])=>c>=2).sort((a,b)=>b[1]-a[1]).slice(0,4)
    .map(([id,c])=>{ const p=PATTERN_TAXONOMY.find(x=>x.id===id); return p? `${p.label} (zeigte sich in ${c} von ${total} bisherigen Sitzungen)` : null; }).filter(Boolean);
  const beliefsNeg = new Set(); sessions.forEach(s=>((s.analysis&&(s.analysis.beliefsNegative||s.analysis.beliefs))||[]).forEach(b=>beliefsNeg.add(b)));
  const beliefsPos = new Set(); sessions.forEach(s=>((s.analysis&&s.analysis.beliefsPositive)||[]).forEach(b=>beliefsPos.add(b)));
  const resources = new Set(); sessions.forEach(s=>(s.analysis?.resources||[]).forEach(r=>resources.add(r)));
  const lastWithSummary = sessions.find(s=>s.summary);
  let text = '';
  if(recurring.length) text += `Mögliche wiederkehrende Themen aus früheren Sitzungen (NUR als vorsichtige, offene Beobachtung ansprechen, niemals als Tatsache oder Diagnose; Beispiel: "Mir fällt auf, dass sich dieses Thema in mehreren Sitzungen wiederholt hat. Möchtest du gemeinsam erkunden, ob darin ein Muster steckt?"): ${recurring.join('; ')}.\n`;
  if(beliefsNeg.size) text += `Bereits in früheren Sitzungen genannte belastende Glaubenssätze (nur nutzen, falls thematisch passend): ${Array.from(beliefsNeg).slice(0,6).join('; ')}.\n`;
  if(beliefsPos.size) text += `Bereits erkannte stärkende Glaubenssätze dieses Menschen (nutze sie aktiv, um ihn an sich selbst zu erinnern): ${Array.from(beliefsPos).slice(0,6).join('; ')}.\n`;
  if(resources.size) text += `Bereits bekannte Ressourcen des Nutzers: ${Array.from(resources).slice(0,6).join('; ')}.\n`;
  if(lastWithSummary && lastWithSummary.summary.observeUntilNextTime && lastWithSummary.summary.observeUntilNextTime.length){
    text += `Der Nutzer wollte seit der letzten Sitzung beobachten: ${lastWithSummary.summary.observeUntilNextTime.join('; ')}.\n`;
  }
  const recentWins = State.journal.filter(j=>j.type==='win').slice(0,8).map(j=> fmtDateShort(j.date)+': '+j.content);
  if(recentWins.length) text += `WACHSTUMSGEDÄCHTNIS — bereits gespeicherte kleine mutige Schritte/Erfolge dieses Menschen, mit Datum. Nutze sie für konkrete, warme Rückbezüge, wenn es zum Gespräch passt (siehe Beispiel oben "Darf ich dich an den ... erinnern?"): ${recentWins.join(' | ')}.\n`;
  const milestones = State.journal.filter(j=>j.type==='milestone').slice(0,5).map(j=> fmtDateShort(j.date)+': '+j.content);
  if(milestones.length) text += `Bisherige persönliche Meilensteine dieses Menschen: ${milestones.join(' | ')}.\n`;
  const details = State.journal.filter(j=>j.type==='detail').slice(0,10).map(j=> fmtDateShort(j.date)+': '+j.content);
  if(details.length) text += `WAS DU ÜBER DAS LEBEN DIESES MENSCHEN WEISST (wie eine gute Freundin — frag von dir aus nach, wie es damit weitergegangen ist, wenn es passt): ${details.join(' | ')}.\n`;
  if(State.goals && State.goals.length){
    const goalLines = State.goals.map(g=> g.type==='target'
      ? `${g.title}: ${g.currentValue}/${g.targetValue}${g.unit?' '+g.unit:''}${g.deadline?' (Frist: '+fmtDateShort(g.deadline)+')':''}`
      : `${g.title} (Gewohnheit)${g.deadline?' bis '+fmtDateShort(g.deadline):''}`);
    text += `Aktuelle Ziele dieses Menschen (erinnere liebevoll daran, wenn es zum Gespräch passt, ohne Druck zu machen): ${goalLines.join(' | ')}.\n`;
  }
  const {stuckScripts, nearGoals} = getStuckItems();
  if(stuckScripts.length || nearGoals.length){
    const stuckLines = [
      ...stuckScripts.map(s=> `Skript "${s.topic}" seit ${daysAgo(s.createdAt)} Tagen fertig, aber nicht gepostet`),
      ...nearGoals.map(g=> `Ziel "${g.title}" bei ${g.currentValue}/${g.targetValue}${g.unit?' '+g.unit:''}, kurz vor dem Abschluss`),
    ];
    text += `MUSTER-ACHTUNG — bekanntes Thema "Energieverlust vor Abschluss": Aktuell steht Folgendes kurz vor dem Fertigwerden, ist aber noch nicht abgeschlossen — genau der Moment, in dem sich das bekannte Muster oft zeigt. Sprich es behutsam an, wenn es passt, besonders im Antreiber-Modus, aber ohne Druck oder Vorwurf: ${stuckLines.join(' | ')}.\n`;
  }
  return text;
}

  const mode = State.coachMode || 'reflect';

function extractMeta(raw){
  const m = raw.match(/<meta>([\s\S]*?)<\/meta>/);
  let meta = {crisis:false, feelings:[], needs:[], beliefsNegative:[], beliefsPositive:[], resources:[], pattern:'', bodySignal:'', patternTags:[], smallWin:'', personalDetails:[]};
  if(m){
    try{ meta = Object.assign(meta, JSON.parse(m[1])); }catch(e){}
  }
  const visible = raw.replace(/<meta>[\s\S]*?<\/meta>/,'').trim();
  return {visible, meta};
}

function getStuckItems(){
  const now = Date.now();
  const twoDaysMs = 2*24*60*60*1000;
  const stuckScripts = (State.scripts||[]).filter(s => !s.posted && (now - new Date(s.createdAt).getTime()) > twoDaysMs);
  const nearGoals = (State.goals||[]).filter(g => g.type==='target' && g.targetValue>0 && (g.currentValue/g.targetValue) >= 0.7 && g.currentValue < g.targetValue);
  return {stuckScripts, nearGoals};
}
function daysAgo(iso){ return Math.max(1, Math.floor((Date.now() - new Date(iso).getTime())/86400000)); }

function computeGrowthPoints(){
  const wins = State.journal.filter(j=>j.type==='win').length;
  const milestones = State.journal.filter(j=>j.type==='milestone').length;
  const sessions = State.sessions.filter(s=>s.messages.some(m=>m.role==='user')).length;
  return wins*1 + milestones*3 + sessions*1;
}
function treeStageIndex(points){
  let idx = 0;
  for(let i=0;i<TREE_STAGES.length;i++){ if(points>=TREE_STAGES[i].min) idx=i; }

}
function currentSeason(){

}

function treeSvg(points, opts){
  opts = opts || {};
  const stage = treeStageIndex(points);
  const season = currentSeason();
  const sm = SEASON_META[season];
  const w = opts.width || 320, h = opts.height || 300;
  const groundY = h - 34;
  const trunkH = 26 + stage*18;
  const trunkTopY = groundY - trunkH;
  const trunkW = 8 + stage*2.2;
  const canopyR = 16 + stage*13;
  const cx = w/2;

  let svg = `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px;display:block;margin:0 auto;">`;

  // sky/ambient
  if(stage>=4){
    for(let i=0;i<5;i++){
      const rx = cx - canopyR*1.4 + i*(canopyR*0.7);
      svg += `<line x1="${rx}" y1="${trunkTopY-canopyR-14}" x2="${rx-14}" y2="${trunkTopY-canopyR*1.7-14}" stroke="${sm.accent}" stroke-width="2" opacity="0.35" stroke-linecap="round"/>`;
    }
  }
  if(season==='winter'){
    for(let i=0;i<10;i++){
      svg += `<circle cx="${(i*37+13)%w}" cy="${(i*53+8)%(groundY-10)}" r="1.6" fill="#EAF1EC" opacity="0.8"/>`;
    }
  }

  // ground
  svg += `<ellipse cx="${cx}" cy="${groundY+6}" rx="${70+stage*8}" ry="12" fill="var(--sand)" opacity="0.6"/>`;

  // bench (stage 5+)
  if(stage>=5){
    svg += `<g opacity="0.9">
      <rect x="${cx-34}" y="${groundY-2}" width="68" height="5" rx="2" fill="#8A6A46"/>
      <rect x="${cx-30}" y="${groundY+3}" width="4" height="12" fill="#6E5236"/>
      <rect x="${cx+26}" y="${groundY+3}" width="4" height="12" fill="#6E5236"/>
    </g>`;
  }
  // swing (stage 6)
  if(stage>=6){
    const branchX = cx+canopyR*0.5, branchY = trunkTopY - canopyR*0.3;
    svg += `<line x1="${branchX}" y1="${branchY}" x2="${branchX+2}" y2="${branchY+38}" stroke="#8A6A46" stroke-width="1.6"/>
            <line x1="${branchX+16}" y1="${branchY}" x2="${branchX+14}" y2="${branchY+38}" stroke="#8A6A46" stroke-width="1.6"/>
            <rect x="${branchX-2}" y="${branchY+38}" width="20" height="4" rx="2" fill="#8A6A46"/>`;
  }

  // trunk
  if(stage===0){
    svg += `<path d="M${cx},${groundY} q-2,-14 0,-22" stroke="#6E9C5C" stroke-width="3" fill="none" stroke-linecap="round"/>
            <ellipse cx="${cx-5}" cy="${groundY-20}" rx="6" ry="3.4" fill="${sm.canopyLight}" transform="rotate(-30 ${cx-5} ${groundY-20})"/>
            <ellipse cx="${cx+5}" cy="${groundY-20}" rx="6" ry="3.4" fill="${sm.canopyLight}" transform="rotate(30 ${cx+5} ${groundY-20})"/>`;
  } else {
    svg += `<path d="M${cx-trunkW/2},${groundY} C${cx-trunkW/2-3},${trunkTopY+trunkH*0.5} ${cx-trunkW/2+2},${trunkTopY+8} ${cx},${trunkTopY}
             C${cx+trunkW/2-2},${trunkTopY+8} ${cx+trunkW/2+3},${trunkTopY+trunkH*0.5} ${cx+trunkW/2},${groundY} Z" fill="#8A6A46"/>`;
  }

  // canopy (layered soft circles)
  if(stage>=1){
    const layers = Math.min(3+stage, 8);
    for(let i=0;i<layers;i++){
      const ang = (i/layers)*Math.PI*2;
      const rad = canopyR*0.38;
      const px = cx + Math.cos(ang)*rad*0.8;
      const py = trunkTopY - canopyR*0.55 + Math.sin(ang)*rad*0.55;
      const r = canopyR*(0.42 + (i%2)*0.08);
      svg += `<circle cx="${px}" cy="${py}" r="${r}" fill="${i%2===0?sm.canopy:sm.canopyLight}" opacity="0.95"/>`;
    }
    svg += `<circle cx="${cx}" cy="${trunkTopY-canopyR*0.6}" r="${canopyR*0.55}" fill="${sm.canopy}"/>`;
  }

  // blossoms/flowers (stage 3+, spring/summer stronger)
  if(stage>=3){
    const blossomN = Math.min(4+stage, 14);
    for(let i=0;i<blossomN;i++){
      const ang = (i/blossomN)*Math.PI*2 + 0.4;
      const rad = canopyR*0.55;
      const px = cx + Math.cos(ang)*rad;
      const py = trunkTopY - canopyR*0.6 + Math.sin(ang)*rad*0.7;
      svg += `<circle cx="${px}" cy="${py}" r="3" fill="${sm.accent}"/>`;
    }
  }
  // caterpillars — the beginning of the metamorphosis (stage 2+)
  if(stage>=2){
    const caterpillarN = stage>=5 ? 1 : (stage>=3 ? 1 : 2);
    for(let i=0;i<caterpillarN;i++){
      const cx2 = cx - canopyR*0.5 + i*canopyR*0.9;
      const cy2 = trunkTopY - canopyR*0.15 + i*4;
      svg += caterpillarGroup(cx2, cy2, 1 + i*0.15);
    }
  }
  // butterflies — grown from caterpillars, flying and flapping (stage 3+)
  if(stage>=3){
    const flyClasses = ['fly-a','fly-b','fly-c'];
    const wingPairs = [[sm.accent, sm.canopyLight], [sm.canopyLight, sm.accent], [sm.accent, '#FBEFD9']];
    const butterflyN = Math.min(1 + (stage-3), 5);
    for(let i=0;i<butterflyN;i++){
      const ang = (i/butterflyN)*Math.PI*1.5 - 0.4;
      const rad = canopyR + 14 + (i%2)*10;
      const bx = cx + Math.cos(ang)*rad;
      const by = trunkTopY - canopyR*0.7 + Math.sin(ang)*rad*0.55;
      const size = 3.4 + (i%3)*0.4;
      const [w1,w2] = wingPairs[i%wingPairs.length];
      svg += butterflyGroup(bx, by, size, flyClasses[i%flyClasses.length], i*0.9, w1, w2);
    }
  }
  // birds (stage 4+)
  if(stage>=4){
    svg += `<path d="M${cx+canopyR+4},${trunkTopY-canopyR-6} q4,-5 8,0 q-4,-1 -4,3 q0,-4 -4,-3Z" fill="var(--forest)" opacity="0.8"/>
            <path d="M${cx+canopyR+22},${trunkTopY-canopyR-16} q3,-4 6,0 q-3,-1 -3,2 q0,-3 -3,-2Z" fill="var(--forest)" opacity="0.6"/>`;
  }
  // small flowers at base (stage 5+)
  if(stage>=5){
    for(let i=0;i<5;i++){
      const fx = cx - 55 + i*27;
      svg += `<circle cx="${fx}" cy="${groundY+4}" r="2.6" fill="${sm.accent}"/>`;
    }
  }
  svg += `</svg>`;
  return svg;
}
function nextStageInfo(points){
  const idx = treeStageIndex(points);
  if(idx >= TREE_STAGES.length-1) return null;
  const next = TREE_STAGES[idx+1];
  return {name: next.name, remaining: next.min - points};
}

function growthRingSvg(size, rings){
  rings = Math.max(1, Math.min(rings||1,6));
  let circles='';
  for(let i=0;i<rings;i++){
    const r = 4 + i*3;
    circles += `<circle class="breathe" style="animation-delay:${i*0.25}s" cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--sage)" stroke-width="1.4"></circle>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${circles}</svg>`;
}

async function checkGoalMilestones(g){
  const thresholds = [1,10,100].filter(t=> t<=g.targetValue);
  if(g.currentValue===g.targetValue && !thresholds.includes(g.targetValue)) thresholds.push(g.targetValue);
  for(const t of thresholds){
    if(g.currentValue===t){
      const already = State.journal.some(j=> j.type==='milestone' && j.content.includes(g.title) && j.content.includes(String(t)));
      if(!already){
        await saveJournalEntry({id:uid(), date:nowISO(), type:'milestone', favorite:false, title:'🌱 Meilenstein', content: `${g.title} – ${t}${g.unit?' '+g.unit:''} erreicht`});
      }
    }
  }
}

/* ============================= CHAT ============================= */
function ensureSession(){
  if(State.currentSessionId && State.sessions.find(s=>s.id===State.currentSessionId)) return;
  const last = State.sessions[0];
  let opener = 'Schön, dass du dir diesen Moment nimmst. Wie geht es dir gerade – ganz allgemein?';
  if(last && last.summary && last.summary.nextSteps && last.summary.nextSteps[0]){
    opener = `Schön, dich wiederzusehen. Letztes Mal hattest du dir vorgenommen: „${last.summary.nextSteps[0]}“ — magst du erzählen, wie es dir damit ergangen ist, oder möchtest du lieber bei etwas Neuem beginnen?`;
  }
  const sess = {
    id: uid(), createdAt: nowISO(), updatedAt: nowISO(),
    messages: [{role:'assistant', content:opener, meta:null}],
    analysis: {feelings:{}, needs:[], beliefsNegative:[], beliefsPositive:[], resources:[], patterns:[], patternTags:{}},
    summary: null,
  };
  State.sessions.unshift(sess);
  State.currentSessionId = sess.id;
  saveSession(sess);
}

function currentSession(){ return State.sessions.find(s=>s.id===State.currentSessionId); }

function renderMessages(){
  const scroll = document.getElementById('chatScroll');

  }).join('');
  if(State.sending){
    scroll.innerHTML += `<div class="typing"><span></span><span></span><span></span></div>`;
  }

function renderCrisisInline(){
  const scroll = document.getElementById('chatScroll');

  wrap.innerHTML = crisisPanelHtml();
  scroll.appendChild(wrap);
  scroll.scrollTop = scroll.scrollHeight;
  wrap.querySelector('#groundingBtn').addEventListener('click', ()=>{

    wrap.appendChild(g); scroll.scrollTop = scroll.scrollHeight;
  });
  wrap.querySelector('#continueAnywayBtn').addEventListener('click', ()=>{
    State.crisisActive = false; renderChat(document.getElementById('viewRoot'));
  });
}

async function handleSend(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text || State.sending) return;
  input.value=''; input.style.height='auto';
  const sess = currentSession();
  sess.messages.push({role:'user', content:text});
  renderMessages();
  await saveSession(sess);

  if(textHasCrisisSignal(text)){
    State.crisisActive = true;
    sess.messages.push({role:'note', content:'Belastungssignal erkannt — stabilisierender Modus aktiviert.'});
    await saveSession(sess);
    renderChat(document.getElementById('viewRoot'));
    return;
  }

  if(!hasApiKey()){
    sess.messages.push({role:'note', content:'Um mit deinem Begleiter zu sprechen, hinterlege zuerst in den Einstellungen einen Anthropic API-Key.'});
    await saveSession(sess);
    renderMessages();
    return;
  }

  State.sending = true; renderMessages();
  try{
    const apiMessages = sess.messages.filter(m=>m.role==='user'||m.role==='assistant').map(m=>({role:m.role, content:m.content}));
    const raw = await callClaude(coachSystemPrompt(sess), apiMessages, 1000);
    const {visible, meta} = extractMeta(raw);
    const cleanVisible = stripEmDashes(visible);
    mergeAnalysis(sess, meta);
    if(meta.smallWin && meta.smallWin.trim()){
      await saveJournalEntry({id:uid(), date:nowISO(), type:'win', favorite:false, title:'Kleiner Erfolg', content: meta.smallWin.trim(), sessionId: sess.id});
    }
    for(const detail of (meta.personalDetails||[])){
      const d = detail.trim();
      if(!d) continue;
      const already = State.journal.some(j=> j.type==='detail' && j.content.toLowerCase()===d.toLowerCase());
      if(!already){
        await saveJournalEntry({id:uid(), date:nowISO(), type:'detail', favorite:false, title:'Über dich', content: d, sessionId: sess.id});
      }
    }
    sess.messages.push({role:'assistant', content: cleanVisible || 'Ich bin noch bei dir. Magst du das noch etwas anders in Worte fassen?'});
    State.sending = false;
    await saveSession(sess);
    renderMessages();
    if(meta.crisis){
      State.crisisActive = true;
      renderChat(document.getElementById('viewRoot'));
    }
  }catch(e){
    State.sending = false;
    sess.messages.push({role:'note', content:'Der Begleiter ist gerade nicht erreichbar (' + e.message + '). Prüfe in den Einstellungen, ob dein API-Key korrekt hinterlegt ist.'});
    renderMessages();
  }
}

function mergeAnalysis(sess, meta){
  if(!sess.analysis) sess.analysis = {feelings:{}, needs:[], beliefsNegative:[], beliefsPositive:[], resources:[], patterns:[], patternTags:{}};
  if(!sess.analysis.patternTags) sess.analysis.patternTags = {};
  if(!sess.analysis.beliefsNegative) sess.analysis.beliefsNegative = sess.analysis.beliefs || [];
  if(!sess.analysis.beliefsPositive) sess.analysis.beliefsPositive = [];
  (meta.feelings||[]).forEach(f=>{ sess.analysis.feelings[f] = (sess.analysis.feelings[f]||0)+1; });
  (meta.needs||[]).forEach(n=>{ if(!sess.analysis.needs.includes(n)) sess.analysis.needs.push(n); });
  (meta.beliefsNegative||[]).forEach(b=>{ if(!sess.analysis.beliefsNegative.includes(b)) sess.analysis.beliefsNegative.push(b); });
  (meta.beliefsPositive||[]).forEach(b=>{ if(!sess.analysis.beliefsPositive.includes(b)) sess.analysis.beliefsPositive.push(b); });
  (meta.resources||[]).forEach(r=>{ if(!sess.analysis.resources.includes(r)) sess.analysis.resources.push(r); });
  if(meta.pattern){ if(!sess.analysis.patterns.includes(meta.pattern)) sess.analysis.patterns.push(meta.pattern); }
  (meta.patternTags||[]).forEach(t=>{
    if(PATTERN_TAXONOMY.some(p=>p.id===t)) sess.analysis.patternTags[t] = (sess.analysis.patternTags[t]||0)+1;
  });
}

async function endSession(){
  const sess = currentSession();
  if(sess.messages.filter(m=>m.role==='user').length===0){
    alert('Schreib gern zuerst ein paar Zeilen, bevor du die Sitzung abschließt.'); return;
  }
  if(!hasApiKey()){
    alert('Um eine Zusammenfassung zu erstellen, hinterlege zuerst in den Einstellungen einen Anthropic API-Key.'); return;

function renderWheel(container){
  let selectedPrimary = null;
  function draw(){
    const size=280, cx=size/2, cy=size/2, rOuter=125, rInner=55;
    const n = FEELING_WHEEL.length;
    let sectors='';
    FEELING_WHEEL.forEach((f,i)=>{
      const a0 = (i/n)*2*Math.PI - Math.PI/2, a1 = ((i+1)/n)*2*Math.PI - Math.PI/2;
      const x0=cx+rOuter*Math.cos(a0), y0=cy+rOuter*Math.sin(a0);
      const x1=cx+rOuter*Math.cos(a1), y1=cy+rOuter*Math.sin(a1);
      const xi0=cx+rInner*Math.cos(a0), yi0=cy+rInner*Math.sin(a0);
      const xi1=cx+rInner*Math.cos(a1), yi1=cy+rInner*Math.sin(a1);
      const mid = (a0+a1)/2; const lx=cx+((rOuter+rInner)/2)*Math.cos(mid), ly=cy+((rOuter+rInner)/2)*Math.sin(mid);
      const path = `M${xi0},${yi0} L${x0},${y0} A${rOuter},${rOuter} 0 0 1 ${x1},${y1} L${xi1},${yi1} A${rInner},${rInner} 0 0 0 ${xi0},${yi0} Z`;
      const active = selectedPrimary===f.name;
      sectors += `<path d="${path}" fill="${f.color}" opacity="${active?1:0.78}" stroke="var(--surface)" stroke-width="2" data-primary="${f.name}" style="cursor:pointer;"></path>`;
      sectors += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-size="11" font-weight="600" style="pointer-events:none;font-family:var(--font-body);">${f.name}</text>`;
    });
    container.innerHTML = `
      <div class="wheel-layout">
        <div class="wheel-svg-wrap">
          <svg viewBox="0 0 ${size} ${size}" width="100%">${sectors}<circle cx="${cx}" cy="${cy}" r="${rInner-4}" fill="var(--bg-soft)"></circle></svg>
        </div>
        <div class="wheel-detail">
          ${selectedPrimary ? `
            <h4 style="margin-top:0;">${selectedPrimary}</h4>
            <div id="subChips">${FEELING_WHEEL.find(f=>f.name===selectedPrimary).sub.map(s=>`<span class="chip" data-sub="${s}">${s}</span>`).join('')}</div>
          ` : `<p style="color:var(--text-soft);font-size:14px;">Tippe auf einen Bereich des Rads, um genauer zu benennen, was gerade in dir ist.</p>`}
        </div>
      </div>`;
    container.querySelectorAll('[data-primary]').forEach(p=> p.addEventListener('click', ()=>{ selectedPrimary = p.getAttribute('data-primary'); draw(); }));
    container.querySelectorAll('[data-sub]').forEach(c=> c.addEventListener('click', async ()=>{
      const feeling = selectedPrimary+' – '+c.getAttribute('data-sub');
      await saveJournalEntry({id:uid(), date:nowISO(), type:'feeling', favorite:false, title:'Gefühl benannt', content:feeling});
      c.classList.add('selected');
      toast('„'+feeling+'“ wurde im Tagebuch festgehalten.');
    }));
  }
  draw();
}

/* ============================= SPRACHEINGABE ============================= */
function speechSupported(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function micButtonHtml(id){ return `<button type="button" class="mic-btn" id="${id}" title="Spracheingabe">${ICONS.mic}</button>`; }
function wireVoiceButton(btn, targetEl, onFinal){
  if(!btn || !targetEl) return;
  if(!speechSupported()){
    btn.addEventListener('click', ()=> toast('Spracheingabe wird von diesem Browser leider nicht unterstützt (funktioniert z.B. in Chrome oder Edge).'));
    btn.style.opacity = '0.45';
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizing = false, recognition = null, baseValue = '';
  btn.addEventListener('click', ()=>{
    if(recognizing){ recognition && recognition.stop(); return; }
    recognition = new SR();
    recognition.lang = 'de-DE';
    recognition.interimResults = true;
    recognition.continuous = true;
    baseValue = targetEl.value || '';
    recognition.onstart = ()=>{ recognizing = true; btn.classList.add('recording'); btn.title = 'Aufnahme läuft — antippen zum Beenden'; };
    recognition.onerror = (e)=>{
      recognizing = false; btn.classList.remove('recording'); btn.title = 'Spracheingabe';
      if(e.error!=='no-speech' && e.error!=='aborted') toast('Spracheingabe fehlgeschlagen. Prüfe die Mikrofon-Berechtigung.');
    };
    recognition.onend = ()=>{ recognizing = false; btn.classList.remove('recording'); btn.title = 'Spracheingabe'; };
    recognition.onresult = (e)=>{
      let sessionText = '';
      for(let i=0;i<e.results.length;i++){ sessionText += (i>0?' ':'') + e.results[i][0].transcript; }
      sessionText = sessionText.trim();
      if(!sessionText) return;
      const sep = baseValue && !/[\s\n]$/.test(baseValue) ? ' ' : '';
      targetEl.value = baseValue + sep + sessionText;
      targetEl.dispatchEvent(new Event('input'));
      if(onFinal) onFinal(targetEl.value);
    };
    try{ recognition.start(); }catch(err){ toast('Spracheingabe konnte nicht gestartet werden.'); }
  });
}

function wireStoryPlanActions(root){
  root.querySelector('#genStoryPlanBtn')?.addEventListener('click', async (e)=>{
    const errBox = root.querySelector('#storyPlanErrorBox');
    errBox.style.display = 'none';
    if(!hasApiKey()){ toast('Bitte hinterlege zuerst in den Einstellungen einen Anthropic API-Key.'); return; }
    e.target.disabled = true; const orig = e.target.textContent; e.target.textContent = 'Erstelle deinen Plan ...';
    function repairJson(json){
      // common fix: smart quotes -> straight, then attempt to escape stray internal quotes in string values is unreliable,
      // so as a repair pass we just normalize smart quotes/dashes which are frequent JSON breakers.
      return json.replace(/[\u201C\u201D]/g,'"').replace(/[\u2018\u2019]/g,"'");
    }
    function extractObj(raw){
      let json = raw.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
      try{ return JSON.parse(json); }
      catch(parseErr){
        const match = json.match(/\{[\s\S]*\}/);
        const candidate = match ? match[0] : json;
        try{ return JSON.parse(candidate); }
        catch(e2){
          try{ return JSON.parse(repairJson(candidate)); }
          catch(e3){ throw new Error('Antwort war kein gültiges JSON: "' + raw.slice(0,180) + '"'); }
        }
      }
    }
    try{
      let parsed;
      let lastErr;
      for(let attempt=0; attempt<3 && !parsed; attempt++){
        try{
          const content = attempt===0
            ? 'Bitte erstelle den 7-Tage-Plan.'
            : 'Bitte erstelle den 7-Tage-Plan neu. Antworte NUR mit dem JSON-Objekt, keine Rückfrage, keine doppelten Anführungszeichen innerhalb der Textwerte, halte jede Idee unter 15 Wörtern.';
          const raw = await callClaude(storyPlanSystemPrompt(State.productInfo), [{role:'user', content}], 3000);
          parsed = extractObj(raw);
        }catch(err){ lastErr = err; }
      }
      if(!parsed) throw lastErr;
      parsed = sanitizeDeep(parsed);
      if(!parsed.days || !Array.isArray(parsed.days)) throw new Error('Antwort enthielt kein "days"-Array.');
      const plan = {id:uid(), createdAt:nowISO(), days: parsed.days.map(d=> Object.assign({done:false}, d))};
      await saveStoryPlan(plan);
      root.querySelector('#storyPlansWrap').innerHTML = storyPlansListHtml();
      wireStoryPlanActions(root);
      toast('7-Tage-Plan erstellt.');
    }catch(err){
      errBox.textContent = 'Plan konnte nicht erstellt werden: ' + err.message;
      errBox.style.display = 'block';
    }
    e.target.disabled = false; e.target.textContent = orig;
  });
  root.querySelectorAll('[data-delplan]').forEach(b=> b.addEventListener('click', async ()=>{
    if(confirm('Diesen Plan wirklich löschen?')){ await deleteStoryPlan(b.getAttribute('data-delplan')); root.querySelector('#storyPlansWrap').innerHTML = storyPlansListHtml(); wireStoryPlanActions(root); }
  }));
  root.querySelectorAll('[data-plandaydone]').forEach(cb=> cb.addEventListener('change', async ()=>{
    const [planId, dayNum] = cb.getAttribute('data-plandaydone').split(':');
    const plan = State.storyPlans.find(p=>p.id===planId);
    if(!plan) return;
    const day = plan.days.find(d=> String(d.day)===dayNum);
    if(!day) return;
    day.done = cb.checked;
    await saveStoryPlan(plan);
    root.querySelector('#storyPlansWrap').innerHTML = storyPlansListHtml();
    wireStoryPlanActions(root);
  }));
}

function fmtDateShort(iso){ return new Date(iso).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'}); }

function buildItemStats(chronSessions, field){
  const map = {};
  chronSessions.forEach(s=>{
    let arr = (s.analysis && s.analysis[field]) || [];
    if(field==='beliefsNegative' && arr.length===0 && s.analysis && s.analysis.beliefs){ arr = s.analysis.beliefs; }
    arr.forEach(name=>{
      if(!map[name]) map[name] = {name, count:0, firstSeen:s.createdAt, lastSeen:s.createdAt};
      map[name].count++;
      map[name].lastSeen = s.createdAt;
    });
  });
  let items = Object.values(map);
  if(field==='beliefsNegative'){
    items = items.map(it=>{
      const sessionsAfter = chronSessions.filter(s=> new Date(s.createdAt) > new Date(it.lastSeen)).length;
      const daysSince = (Date.now() - new Date(it.lastSeen).getTime())/86400000;
      return Object.assign({}, it, {stale: sessionsAfter>=2 && daysSince>=14});
    });
  }
  items.sort((a,b)=> new Date(b.lastSeen)-new Date(a.lastSeen));
  return items;
}
function renderStatItemsHtml(items, showStale){
  if(!items.length) return `<p style="color:var(--text-faint);font-size:13.5px;">Nichts gefunden.</p>`;

function activityCalendarHtml(sessions, journal){
  const activity = {};
  sessions.forEach(s=>{ const k=new Date(s.createdAt).toISOString().slice(0,10); activity[k]=(activity[k]||0)+1; });
  journal.forEach(j=>{ const k=new Date(j.date).toISOString().slice(0,10); activity[k]=(activity[k]||0)+1; });

  const today = new Date(); today.setHours(0,0,0,0);
  const totalDays = 98;
  const start = new Date(today); start.setDate(start.getDate()-(totalDays-1));
  const startDow = (start.getDay()+6)%7;
  start.setDate(start.getDate()-startDow);

  const weeks = [];
  let cursor = new Date(start);
  while(cursor <= today){
    const week = [];
    for(let d=0; d<7; d++){
      const key = cursor.toISOString().slice(0,10);
      week.push({dateStr:cursor.toLocaleDateString('de-DE'), count: activity[key]||0, future: cursor>today});
      cursor.setDate(cursor.getDate()+1);
    }
    weeks.push(week);
  }
  function cellColor(count, future){
    if(future) return 'transparent';
    if(count===0) return 'var(--surface-2)';
    if(count===1) return 'var(--sage-light)';
    if(count===2) return 'var(--sage)';
    return 'var(--sage-dark)';
  }
  const grid = weeks.map(week=>`<div style="display:flex;flex-direction:column;gap:3px;">${week.map(d=>`<div title="${d.dateStr}${d.count?' · '+d.count+'×':''}" style="width:11px;height:11px;border-radius:3px;background:${cellColor(d.count,d.future)};"></div>`).join('')}</div>`).join('');
  const activeWeeks = weeks.filter(w=> w.some(d=>d.count>0 && !d.future)).length;

  return `
    <div class="card" style="margin-bottom:20px;">
      <h3 style="margin-top:0;">Regelmäßigkeit</h3>
      <p style="font-size:12.5px;color:var(--text-soft);margin-top:0;">Wann du dir Zeit für Reflexion genommen hast — kein Muss, kein Countdown, nur ein ruhiger Rückblick der letzten ${weeks.length} Wochen.</p>
      <div style="display:flex;gap:3px;overflow-x:auto;padding:6px 0 2px;">${grid}</div>
      <p style="font-size:11.5px;color:var(--text-faint);margin-top:8px;">Du warst an ${activeWeeks} von ${weeks.length} Wochen aktiv.</p>
    </div>`;
}

  chron.forEach(s=>{
    const k = monthKey(s.createdAt);
    if(!monthly[k]) monthly[k] = {count:0, sessions:0};
    monthly[k].sessions++;
    Object.values((s.analysis&&s.analysis.feelings)||{}).forEach(v=>{ monthly[k].count += v; });
  });
  const monthKeys = Object.keys(monthly).sort();
  const maxMonthly = Math.max(1, ...monthKeys.map(k=>monthly[k].count));

  let beforeAfterHtml = '';
  if(chron.length >= 4){
    const mid = Math.floor(chron.length/2);
    const firstHalf = chron.slice(0,mid), secondHalf = chron.slice(mid);
    function rateMap(arr){
      const counts={};
      arr.forEach(s=>{ Object.entries((s.analysis&&s.analysis.feelings)||{}).forEach(([k,v])=>{ counts[k]=(counts[k]||0)+v; }); });
      const rate={};
      Object.entries(counts).forEach(([k,v])=>{ rate[k]=v/arr.length; });
      return {counts, rate};
    }
    const r1 = rateMap(firstHalf), r2 = rateMap(secondHalf);
    const allFeelings = new Set([...Object.keys(r1.rate), ...Object.keys(r2.rate)]);
    const deltas = Array.from(allFeelings).map(f=>({
      feeling:f, delta:(r2.rate[f]||0)-(r1.rate[f]||0), totalMentions:(r1.counts[f]||0)+(r2.counts[f]||0)
    })).filter(d=>d.totalMentions>=2);
    const increased = [...deltas].filter(d=>d.delta>0.05).sort((a,b)=>b.delta-a.delta).slice(0,4);
    const decreased = [...deltas].filter(d=>d.delta<-0.05).sort((a,b)=>a.delta-b.delta).slice(0,4);
    beforeAfterHtml = `
      <div class="card" style="margin-bottom:20px;">
        <h3 style="margin-top:0;">Vorher – Nachher</h3>
        <p style="font-size:12.5px;color:var(--text-soft);margin-top:0;">Vergleich deiner ersten ${firstHalf.length} mit den letzten ${secondHalf.length} Sitzungen — als Beobachtung gemeint, nicht als Bewertung.</p>
        <div class="home-grid" style="grid-template-columns:1fr 1fr;">
          <div>
            <div class="pill" style="margin-bottom:8px;">Seltener geworden</div>
            ${decreased.length? decreased.map(d=>`<div style="font-size:13.5px;padding:5px 0;">↓ ${escapeHtml(d.feeling)}</div>`).join('') : '<p style="color:var(--text-faint);font-size:13px;">Noch kein klarer Rückgang erkennbar.</p>'}
          </div>
          <div>
            <div class="pill" style="margin-bottom:8px;">Häufiger geworden</div>
            ${increased.length? increased.map(d=>`<div style="font-size:13.5px;padding:5px 0;">↑ ${escapeHtml(d.feeling)}</div>`).join('') : '<p style="color:var(--text-faint);font-size:13px;">Noch kein klarer Anstieg erkennbar.</p>'}
          </div>
        </div>
      </div>`;
  } else {
    beforeAfterHtml = `<div class="card" style="margin-bottom:20px;"><p style="color:var(--text-soft);font-size:13.5px;">Für einen Vorher-Nachher-Vergleich braucht es mindestens 4 geführte Sitzungen. Bisher: ${chron.length}.</p></div>`;
  }

  root.innerHTML = `
    <div class="view scrim-fade" id="progressPrintArea">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;">
        <div><h1 class="display" style="font-size:26px;margin-bottom:4px;">Dein Fortschritt</h1><p class="greeting-sub" style="margin-bottom:0;">Ein Überblick über deinen bisherigen Weg — kein Wettbewerb, nur ein Spiegel.</p></div>
        <button class="btn btn-ghost no-print" id="exportProgressBtn">Als PDF exportieren</button>
      </div>
      <div style="height:20px;"></div>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-num">${State.sessions.length}</div><div class="stat-label">Sitzungen</div></div>
        <div class="stat-card"><div class="stat-num">${exercisesDone}</div><div class="stat-label">Übungen abgeschlossen</div></div>
        <div class="stat-card"><div class="stat-num">${resourceStats.length}</div><div class="stat-label">Ressourcen entdeckt</div></div>
        <div class="stat-card"><div class="stat-num">${beliefStatsNeg.length}</div><div class="stat-label">Belastende Glaubenssätze</div></div>
        <div class="stat-card"><div class="stat-num">${beliefStatsPos.length}</div><div class="stat-label">Stärkende Glaubenssätze</div></div>
      </div>

      ${activityCalendarHtml(State.sessions, State.journal)}

      <div class="card" style="margin-bottom:20px;">
        <h3 style="margin-top:0;">Dein Wachstumsgedächtnis</h3>
        <p style="font-size:12.5px;color:var(--text-soft);margin-top:0;">Kleine mutige Schritte und Meilensteine — Entwicklung besteht aus vielen kleinen Momenten wie diesen.</p>
        ${milestones.length ? `<div style="margin-bottom:${wins.length?'14px':'0'};">${milestones.slice(0,8).map(m=>`<div style="display:flex;gap:10px;padding:6px 0;font-size:13.5px;"><span>🌱</span><div><div>${escapeHtml(m.content)}</div><div style="font-size:11px;color:var(--text-faint);">${fmtDateShort(m.date)}</div></div></div>`).join('')}</div>` : ''}
        ${wins.length ? `<div>${wins.slice(0,8).map(w=>`<div style="display:flex;gap:10px;padding:6px 0;font-size:13.5px;"><span>✦</span><div><div>${escapeHtml(w.content)}</div><div style="font-size:11px;color:var(--text-faint);">${fmtDateShort(w.date)}</div></div></div>`).join('')}</div>` : ''}
        ${(!milestones.length && !wins.length) ? `<p style="color:var(--text-faint);font-size:13.5px;">Noch nichts festgehalten — im Tagebuch kannst du jederzeit einen Erfolg oder Meilenstein eintragen, und dein Begleiter erkennt kleine mutige Schritte oft auch selbst im Gespräch.</p>` : ''}
      </div>

      ${personalDetails.length ? `
      <div class="card" style="margin-bottom:20px;">
        <h3 style="margin-top:0;">Das weiß dein Begleiter über dich</h3>
        <p style="font-size:12.5px;color:var(--text-soft);margin-top:0;">Kleine Dinge aus deinem Leben, die im Gespräch erwähnt wurden — damit er wie eine gute Freundin nachfragen kann, wie es weitergegangen ist.</p>
        <ul style="margin:0;padding-left:20px;font-size:13.8px;line-height:1.8;">${personalDetails.slice(0,15).map(d=>`<li>${escapeHtml(d.content)} <span style="color:var(--text-faint);font-size:11px;">(${fmtDateShort(d.date)})</span></li>`).join('')}</ul>
      </div>` : ''}

      ${monthKeys.length >= 2 ? `
      <div class="card" style="margin-bottom:20px;">
        <h3 style="margin-top:0;">Verlauf über Zeit</h3>
        <p style="font-size:12.5px;color:var(--text-soft);margin-top:0;">Wie viele Gefühle pro Monat in euren Gesprächen benannt wurden.</p>
        <div style="display:flex;align-items:flex-end;gap:6px;height:80px;margin-top:14px;">
          ${monthKeys.map(k=>`<div style="flex:1;background:var(--sage);border-radius:4px 4px 0 0;height:${Math.max(6,(monthly[k].count/maxMonthly)*100)}%;" title="${monthLabel(k)}: ${monthly[k].count}"></div>`).join('')}
        </div>
        <div style="display:flex;gap:6px;margin-top:6px;">
          ${monthKeys.map(k=>`<div style="flex:1;text-align:center;font-size:9.5px;color:var(--text-faint);">${monthLabel(k)}</div>`).join('')}
        </div>
      </div>` : ''}

      ${beforeAfterHtml}

      <div class="card" style="margin-bottom:20px;">
        <h3 style="margin-top:0;">Häufige Gefühle</h3>
        ${Object.keys(feelingCounts).length ? Object.entries(feelingCounts).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v])=>`
          <div class="bar-row"><span class="bar-label">${escapeHtml(k)}</span><div class="bar-track"><div class="bar-fill" style="width:${(v/maxFeel)*100}%"></div></div><span>${v}</span></div>
        `).join('') : `<p style="color:var(--text-faint);font-size:13.5px;">Noch keine Gefühle erfasst — das Gefühlsrad oder ein Gespräch helfen dabei.</p>`}
      </div>

      ${listCardHtml('Belastende Glaubenssätze', 'Formulierungen, die im Gespräch als mögliche einschränkende Überzeugungen aufgetaucht sind — keine Bewertung, nur eine Sammlung zum Wiedererkennen. Wiederkehrende Muster dazu findest du im <span style="cursor:pointer;text-decoration:underline;" data-nav="tiefenkompass">Tiefenkompass</span>.', 'beliefsNegative', beliefStatsNeg, true)}
      ${listCardHtml('Stärkende Glaubenssätze', 'Sätze, die dich tragen — Dinge, die du über dich selbst weißt oder gelernt hast und die dir Kraft geben.', 'beliefsPositive', beliefStatsPos, false)}

      <div class="home-grid">
        ${listCardHtml('Erkannte Bedürfnisse', null, 'needs', needStats, false)}
        ${listCardHtml('Deine Ressourcen', null, 'resources', resourceStats, false)}
      </div>
    </div>`;

  wireListSearch(root, 'beliefsNegative', beliefStatsNeg, true);
  wireListSearch(root, 'beliefsPositive', beliefStatsPos, false);
  wireListSearch(root, 'needs', needStats, false);
  wireListSearch(root, 'resources', resourceStats, false);
  root.querySelector('#exportProgressBtn').addEventListener('click', ()=> window.print());
}

/* ============================= SETTINGS ============================= */
function renderSettings(root){
  root.innerHTML = `
    <div class="view narrow scrim-fade">
      <h1 class="display" style="font-size:26px;">Einstellungen</h1>

      <div class="card" style="margin-bottom:20px;">
        <h3 style="margin-top:0;">Anthropic API-Key</h3>
        <p style="font-size:12.8px;color:var(--text-soft);line-height:1.6;margin-top:0;">
          Für den Gesprächsbegleiter, Sitzungszusammenfassungen und KI-gestützte Briefentwürfe braucht Fühlkraft einen
          eigenen Anthropic API-Key. Du erhältst ihn unter <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>.
          Der Schlüssel wird ausschließlich lokal in deinem Browser gespeichert und nur für Anfragen an Anthropic verwendet — niemals an Dritte weitergegeben.
        </p>
        <label class="field-label">API-Key</label>
        <div style="display:flex;gap:8px;">
          <input type="password" id="apiKeyInput" placeholder="sk-ant-..." value="${escapeHtml(State.apiKey||'')}" style="flex:1;padding:11px 15px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);">
          <button class="btn btn-ghost" id="toggleKeyBtn" type="button" style="flex-shrink:0;">Anzeigen</button>
          <button class="btn btn-primary" id="saveKeyBtn" style="flex-shrink:0;">Speichern</button>
        </div>
        <p style="font-size:11.5px;color:${hasApiKey()?'var(--sage-dark)':'var(--text-faint)'};margin-top:10px;">
          ${hasApiKey() ? `Gespeichert: ${escapeHtml(State.apiKey.slice(0,10))}…${escapeHtml(State.apiKey.slice(-4))} (${State.apiKey.length} Zeichen). Beginnt er nicht mit "sk-ant-" oder wirkt er zu kurz, kopiere ihn erneut aus der Console.` : 'Noch kein API-Key hinterlegt — die KI-Funktionen sind bis dahin nicht nutzbar.'}
        </p>
      </div>

      <div class="card" style="margin-bottom:20px;">
        <h3 style="margin-top:0;">Wie soll dein Begleiter dich nennen?</h3>
        <p style="font-size:12.5px;color:var(--text-soft);margin-top:0;">Ein Name oder Spitzname — dein Begleiter spricht dich damit hin und wieder an, wie eine gute Freundin es tun würde.</p>
        <div style="display:flex;gap:8px;">
          <input type="text" id="userNameInput" value="${escapeHtml(State.userName||'')}" placeholder="z.B. Mia" style="flex:1;padding:11px 15px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);">
          <button class="btn btn-primary" id="saveNameBtn" style="flex-shrink:0;">Speichern</button>
        </div>
      </div>

      <div class="card" style="margin-bottom:20px;">
        <h3 style="margin-top:0;">Antwortstil des Begleiters</h3>
        <p style="font-size:12.5px;color:var(--text-soft);margin-top:0;">Wie ausführlich soll dein Begleiter im Gespräch antworten?</p>
        <div style="display:flex;gap:8px;">
          <button class="btn ${State.responseDepth==='kurz'?'btn-primary':'btn-ghost'}" id="depthKurzBtn" style="flex:1;">Kurz & knapp</button>
          <button class="btn ${State.responseDepth!=='kurz'?'btn-primary':'btn-ghost'}" id="depthAusfBtn" style="flex:1;">Ausführlich & tiefgehend</button>
        </div>
      </div>

      <div class="card" style="margin-bottom:20px;">
        <h3 style="margin-top:0;">Gesprächsmodus</h3>
        <p style="font-size:12.5px;color:var(--text-soft);margin-top:0;">Reflektieren: dein Begleiter stellt vor allem Fragen, damit du selbst zu deiner Antwort findest. Antreiben: klare Ansagen, liebevoller Kick, konkrete nächste Schritte statt Gegenfragen.</p>
        <div style="display:flex;gap:8px;">
          <button class="btn ${State.coachMode!=='drive'?'btn-primary':'btn-ghost'}" id="modeReflectBtn" style="flex:1;">🪞 Reflektieren</button>
          <button class="btn ${State.coachMode==='drive'?'btn-primary':'btn-ghost'}" id="modeDriveBtn" style="flex:1;">🔥 Antreiben</button>
        </div>
      </div>

      <div class="card" style="margin-bottom:20px;">
        <div class="switch-row" style="border-bottom:none;">
          <div><strong>Einfacher Modus</strong><div style="font-size:12px;color:var(--text-faint);">Zeigt nur Start, Mein Baum, Gespräch und Einstellungen. Der Rest bleibt erhalten, verschwindet nur aus dem Weg.</div></div>
          <button class="switch ${State.simpleMode?'on':''}" id="simpleModeSwitch"><span class="knob"></span></button>
        </div>
      </div>

      <div class="card" style="margin-bottom:20px;">
        <h3 style="margin-top:0;">Daten sichern & übertragen</h3>
        <p style="font-size:12.5px;color:var(--text-soft);margin-top:0;">Lädt alle deine Sitzungen, dein Tagebuch, deinen Baum, deine Ziele und Skripte als Datei herunter — zum Sichern oder um sie auf ein anderes Gerät (z.B. dein Handy) zu übertragen. Der API-Key wird aus Sicherheitsgründen nicht mit exportiert.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-primary" id="exportDataBtn">Daten exportieren</button>
          <button class="btn btn-ghost" id="importDataBtn">Daten importieren</button>
          <input type="file" id="importDataFile" accept="application/json" style="display:none;">
        </div>
        <p style="font-size:11.5px;color:var(--text-faint);margin-top:10px;">Beim Importieren werden vorhandene Einträge mit gleicher ID überschrieben, alles andere bleibt erhalten — nichts wird automatisch gelöscht.</p>
      </div>

      <div class="card" style="margin-bottom:20px;">
        <h3 style="margin-top:0;">No-Go-Wörter</h3>
        <p style="font-size:12.5px;color:var(--text-soft);margin-top:0;">Wörter oder Formulierungen, die dein Begleiter nirgends mehr verwenden soll — im Gespräch, in Zusammenfassungen, Skripten und Briefen. Gedankenstriche (—) sind ohnehin immer verboten, unabhängig von dieser Liste.</p>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;">
          ${(State.noGoWords||[]).map((w,i)=>`<span class="chip">${escapeHtml(w)} <span data-rmnogo="${i}" style="cursor:pointer;color:var(--danger);margin-left:4px;">✕</span></span>`).join('') || '<span style="font-size:12.5px;color:var(--text-faint);">Noch keine eingetragen.</span>'}
        </div>
        <div style="display:flex;gap:8px;">
          <input type="text" id="noGoInput" placeholder="Wort oder Formulierung ..." style="flex:1;padding:11px 15px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);">
          <button class="btn btn-primary" id="addNoGoBtn" style="flex-shrink:0;">+</button>
        </div>
      </div>

      <div class="card">
        <div class="switch-row">
          <div><strong>Dark Mode</strong><div style="font-size:12px;color:var(--text-faint);">Ruhige Darstellung für den Abend</div></div>
          <button class="switch ${State.theme==='dark'?'on':''}" id="themeSwitch"><span class="knob"></span></button>
        </div>
        <div class="switch-row" style="border-bottom:none;">
          <div><strong>Alle Daten löschen</strong><div style="font-size:12px;color:var(--text-faint);">Sitzungen und Tagebucheinträge dauerhaft entfernen</div></div>
          <button class="btn btn-danger" id="resetBtn">Löschen</button>
        </div>
      </div>
      <div class="disclaimer-box">
        Fühlkraft speichert deine Einträge lokal in deinem Browser. Diese App ist ein achtsamer
        Reflexionsbegleiter, kein Ersatz für Psychotherapie oder medizinische Behandlung, und stellt keine Diagnosen.
      </div>
    </div>`;
  root.querySelector('#modeReflectBtn').addEventListener('click', async ()=>{
    State.coachMode = 'reflect'; await saveProfile(); renderSettings(root);
  });
  root.querySelector('#modeDriveBtn').addEventListener('click', async ()=>{
    State.coachMode = 'drive'; await saveProfile(); renderSettings(root);
  });
  root.querySelector('#simpleModeSwitch').addEventListener('click', async ()=>{
    State.simpleMode = !State.simpleMode;
    await saveProfile();
    const allowed = ['home','baum','chat','sichtbarkeit','settings'];
    if(State.simpleMode && !allowed.includes(State.view)) State.view = 'home';
    render();
  });
  root.querySelector('#exportDataBtn').addEventListener('click', async ()=>{
    try{
      const backup = await exportAllData();
      const dateStr = new Date().toISOString().slice(0,10);
      downloadJson(backup, 'fuehlkraft-backup-'+dateStr+'.json');
      toast('Export gestartet — schau in deinen Downloads.');
    }catch(err){ toast('Export fehlgeschlagen (' + err.message + ').'); }
  });
  root.querySelector('#importDataBtn').addEventListener('click', ()=>{
    root.querySelector('#importDataFile').click();
  });
  root.querySelector('#importDataFile').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(!confirm('Backup wirklich importieren? Vorhandene Einträge mit gleicher ID werden überschrieben, alles andere bleibt erhalten.')){ e.target.value=''; return; }
    try{
      const text = await file.text();
      const parsed = JSON.parse(text);
      const count = await importAllData(parsed);
      await loadAll();
      toast(count + ' Einträge importiert.');
      render();
    }catch(err){ toast('Import fehlgeschlagen (' + err.message + ').'); }
    e.target.value = '';
  });
  root.querySelector('#addNoGoBtn').addEventListener('click', async ()=>{
    const val = root.querySelector('#noGoInput').value.trim();
    if(!val) return;
    if(!State.noGoWords) State.noGoWords = [];
    if(!State.noGoWords.some(w=>w.toLowerCase()===val.toLowerCase())){ State.noGoWords.push(val); await saveProfile(); }
    renderSettings(root);
  });
  root.querySelector('#noGoInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); root.querySelector('#addNoGoBtn').click(); } });
  root.querySelectorAll('[data-rmnogo]').forEach(x=> x.addEventListener('click', async ()=>{
    const idx = parseInt(x.getAttribute('data-rmnogo'));
    State.noGoWords.splice(idx,1);
    await saveProfile();
    renderSettings(root);
  }));
  root.querySelector('#toggleKeyBtn').addEventListener('click', ()=>{
    const inp = root.querySelector('#apiKeyInput');
    const btn = root.querySelector('#toggleKeyBtn');
    if(inp.type==='password'){ inp.type='text'; btn.textContent='Verbergen'; }
    else { inp.type='password'; btn.textContent='Anzeigen'; }
  });
  root.querySelector('#saveKeyBtn').addEventListener('click', async ()=>{
    State.apiKey = root.querySelector('#apiKeyInput').value.replace(/\s+/g,'');
    await saveProfile();
    toast('API-Key gespeichert.');
    renderSettings(root);
  });
  root.querySelector('#saveNameBtn').addEventListener('click', async ()=>{
    State.userName = root.querySelector('#userNameInput').value.trim();
    await saveProfile();
    toast('Gespeichert.');
    renderSettings(root);
  });
  root.querySelector('#depthKurzBtn').addEventListener('click', async ()=>{
    State.responseDepth = 'kurz'; await saveProfile(); renderSettings(root);
  });
  root.querySelector('#depthAusfBtn').addEventListener('click', async ()=>{
    State.responseDepth = 'ausfuehrlich'; await saveProfile(); renderSettings(root);
  });
  root.querySelector('#themeSwitch').addEventListener('click', async ()=>{
    State.theme = State.theme==='dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', State.theme);
    await saveProfile();
    renderSettings(root);
  });
  root.querySelector('#resetBtn').addEventListener('click', async ()=>{
    if(!confirm('Wirklich alle Sitzungen und Tagebucheinträge unwiderruflich löschen?')) return;
    for(const s of State.sessions){ await sDelete('session:'+s.id); }
    for(const j of State.journal){ await sDelete('journal:'+j.id); }
    State.sessions=[]; State.journal=[]; State.currentSessionId=null;
    toast('Alle Daten wurden gelöscht.');
    goView('home');
  });
}

/* ============================= INIT ============================= */
async function init(){
  document.getElementById('app').innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--text-soft);font-family:var(--font-body);">Lädt ...</div>`;
  await loadAll();
  render();
}
init();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}

})();
</script>

</body>
</html>
